<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Envoyer un message</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("PUBLIC_KEY_ICI"); // Mets ta Public Key ici
    })();
  </script>
</head>
<body>

<h2>📩 Envoyer un message</h2>

<input type="text" id="nom" placeholder="Votre nom" required><br><br>
<input type="email" id="email" placeholder="Votre email" required><br><br>
<textarea id="message" placeholder="Votre message" required></textarea><br><br>

<button onclick="envoyer()">Envoyer</button>

<script>
function envoyer() {
  emailjs.send("SERVICE_ID_ICI", "TEMPLATE_ID_ICI", {
    nom: document.getElementById("nom").value,
    email: document.getElementById("email").value,
    message: document.getElementById("message").value
  }).then(
    function() {
      alert("Message envoyé ✅");
      document.getElementById("nom").value = "";
      document.getElementById("email").value = "";
      document.getElementById("message").value = "";
    },
    function() {
      alert("Erreur ❌");
    }
  );
}
</script>

</body>
</html>
